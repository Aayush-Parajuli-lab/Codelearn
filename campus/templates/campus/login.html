{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — CodeLearn</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/codelearn.css' %}">
  <script>
    (function () {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom: 24px;">
        <div style="width:30px; height:30px; border:1.5px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:14px;">&lt;/&gt;</div>
        <div class="font-display" style="font-size:20px; font-weight:600;">CodeLearn</div>
      </div>

      {% if form.errors %}
        <div style="background: var(--fail-dim); color: var(--fail); padding: 10px 12px; border-radius: var(--radius); font-size: 13.5px; margin-bottom: 16px;">
          That username or password isn't right. Try again.
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <label class="field-label" for="id_username">Username</label>
        <input class="field-input" type="text" name="username" id="id_username" required autofocus>

        <label class="field-label" for="id_password">Password</label>
        <div class="password-field-wrap">
          <input class="field-input" type="password" name="password" id="id_password" required>
          <button type="button" class="password-toggle-btn" onclick="togglePassword('id_password', this)" tabindex="-1" aria-label="Show password">👁</button>
        </div>

        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color: var(--text-muted); margin: -6px 0 16px; cursor:pointer;">
          <input type="checkbox" name="remember_me" style="margin:0;">
          Remember me for 30 days
        </label>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding: 10px;">Sign in</button>
      </form>

      <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 18px; margin-bottom: 0;">
        Demo accounts (password <span class="font-mono">pass1234</span>): admin1 &middot; teacher1 &middot; student0 &middot; parent1
      </p>
    </div>
  </div>

  <script>
    function togglePassword(fieldId, btn) {
      var field = document.getElementById(fieldId);
      var showing = field.type === 'text';
      field.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁' : '🙈';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }
  </script>
</body>
</html>
