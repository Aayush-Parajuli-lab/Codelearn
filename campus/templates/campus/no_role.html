{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeLearn</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/codelearn.css' %}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <p>Your account doesn't have a role assigned yet. Contact an administrator.</p>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline">Sign out</button>
      </form>
    </div>
  </div>
</body>
</html>
