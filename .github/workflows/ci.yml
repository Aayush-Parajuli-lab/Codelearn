name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (for mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config build-essential

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff — syntax errors and undefined names)
        run: ruff check --select=E9,F accounts academics assignments quizzes attendance ml_engine code_runner code_runner_service campus messaging notifications codelearn manage.py

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Run smoke tests
        run: python manage.py test
