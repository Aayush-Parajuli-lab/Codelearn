# TLS-enabled variant of nginx.conf — see README §"TLS/HTTPS" for how
# to switch to this. Requires a certificate + private key mounted at
# /etc/nginx/certs/ (see nginx/certs/generate_self_signed.sh for local
# testing, or use a real certificate — e.g. Let's Encrypt/certbot — in
# production).

upstream codelearn_web {
    server web:8000;
}

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://codelearn_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
