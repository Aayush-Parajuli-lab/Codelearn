# CodeLearn — Podman Compose deployment
#
# Matches the original architecture:
#   Browser -> nginx -> Web App Container (Django/gunicorn) <-> Database Container (MySQL)
#                                          `-> Code Runner Container (isolated)
#
# Run with:
#   podman-compose up --build
#   (or: docker compose up --build — the file is compatible with both)
#
# The code-runner service is the only container that ever executes
# untrusted student code, and is deliberately hardened and network-
# isolated from everything except the web container that calls it:
#   - internal-only network (no route to the internet)
#   - read_only rootfs + a small tmpfs for compiler scratch space
#   - runs as a non-root user (see code_runner_service/Dockerfile)
#   - no-new-privileges, capabilities dropped
#   - CPU and memory caps so a runaway submission can't starve the host

services:
  db:
    image: docker.io/library/mysql:8.4
    # Django 6.1 requires MySQL 8.4 or later — 8.0 will fail Django's
    # startup checks with "MySQL 8.4 or later is required".
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-codelearn}
      MYSQL_USER: ${DB_USER:-codelearn}
      MYSQL_PASSWORD: ${DB_PASSWORD:-codelearn}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  code-runner:
    build:
      context: ./code_runner_service
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "1.0"
    networks:
      - runner_internal   # no route out to the internet; only web can reach it
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      CODE_RUNNER_URL: http://code-runner:6000
    depends_on:
      db:
        condition: service_healthy
      code-runner:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ml_models:/app/ml_models
    networks:
      - backend
      - runner_internal
    expose:
      - "8000"

  scheduler:
    # Periodically retrains Algorithm 2 (weak-topic classifier) and
    # refreshes Algorithm 3 (KNN) recommendations — see
    # `ml_engine/management/commands/retrain_models.py`. No Celery/cron
    # daemon needed: this is the same web image, just looping the
    # management command instead of running gunicorn.
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      RETRAIN_INTERVAL_SECONDS: ${RETRAIN_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ml_models:/app/ml_models
    networks:
      - backend
    entrypoint: ["/app/docker/scheduler_loop.sh"]

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # For HTTPS: generate a cert (nginx/certs/generate_self_signed.sh
      # for local testing, or a real one for production), then swap
      # the two lines below in for the ones above, and add "443:443"
      # to `ports`:
      #   - ./nginx/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      #   - ./nginx/certs:/etc/nginx/certs:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:
    driver: bridge
  runner_internal:
    driver: bridge
    internal: true   # no default route to the outside world

volumes:
  db_data:
  static_files:
  media_files:
  ml_models:
